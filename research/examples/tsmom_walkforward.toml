# Time-series momentum on ten years of synthetic daily bars (with splits and dividends),
# walk-forward: 3 years of training, then 1 year out of sample, rolling. Only the
# out-of-sample results are reported.
kind = "walkforward"
seed = 0

[data.synthetic_bars]
seed = 7
symbols = ["AAA", "BBB", "CCC", "DDD", "EEE", "FFF", "GGG", "HHH", "III", "JJJ"]
n_days = 2500
start = "2012-01-03"
split_every = 400
dividend_every = 63

[execution]
capital = 1_000_000_000_000  # $1M in micro-dollars
lag = 1
price = "open"

[strategy]
name = "tsmom"

[strategy.grid]
lookback = [60, 120, 250]
vol_window = [20, 60]
target_vol = [0.10]
max_leverage = [2.0]

[walkforward]
train = 750
test = 250

# Costs (M9): the showcase's models and parameters, on synthetic data.
[costs.commission]
per_share = "0.0035"

[costs.sec_fee]
schedule = "sec31"

[costs.spread]
half_spread_bps = 2.0

[costs.impact]
y = 1.0

[costs.financing]
borrow_bps = 50.0
spread_bps = 50.0

[analytics]
benchmark = "AAA"
capacity = [1_000_000_000_000, 100_000_000_000_000]  # $1M and $100M
