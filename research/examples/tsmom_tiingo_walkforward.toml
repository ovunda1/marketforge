# Time-series momentum on the Tiingo ETF universe, walk-forward. Needs TIINGO_API_KEY and
# `make data-tiingo` (docs/data.md). The universe is survivorship-biased (see the
# manifest's note, which the run record carries). Not run in CI.
kind = "walkforward"
seed = 0

[data]
bars = "data/normalized/tiingo-etf-daily/bars.parquet"

[execution]
capital = 1_000_000_000_000
lag = 1
price = "open"

[strategy]
name = "tsmom"

[strategy.grid]
lookback = [60, 120, 250]
vol_window = [20, 60]
target_vol = [0.10]
max_leverage = [2.0]

[walkforward]
train = 756
test = 252
