[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "marketforge"
version = "0.1.0"
description = "Simulated exchange and research backtester"
requires-python = ">=3.12"
# The research layer (M8): NumPy and pandas for bars and analytics, pyarrow for Parquet.
dependencies = ["numpy>=2.0", "pandas>=2.2", "pyarrow>=16"]

[project.optional-dependencies]
# The services (M10): gateway, matcher, projector and backtest worker.
services = [
    "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29", "alembic>=1.13", "redis>=5.0", "arq>=0.26", "prometheus-client>=0.20",
    "pyyaml>=6", "httpx>=0.27", "websockets>=12",
]
dev = ["pytest>=8", "mypy>=1.11", "marketforge[services]"]

# The mfengine extension (M7) and the pure-Python reference engine in one wheel. The
# dev install (make venv) is editable and checks invariants; make venv-release builds a
# Release wheel with the invariant walk off for backtests (mfengine.INVARIANT_CHECKS).
[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
cmake.build-type = "RelWithDebInfo"
build-dir = "build-py/{wheel_tag}"
build.targets = ["_core"]
install.components = ["mfengine"]
wheel.packages = ["bindings/mfengine", "reference", "research", "services"]
editable.mode = "redirect"
editable.verbose = false

[tool.scikit-build.cmake.define]
MF_BUILD_BINDINGS = "ON"
MF_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["compose: needs the running compose stack (make test-services)"]
