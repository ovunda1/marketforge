[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "marketforge"
version = "0.1.0"
description = "Simulated exchange and research backtester"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
# No Python packages yet; research/, services/ and reference/ arrive in later milestones.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
