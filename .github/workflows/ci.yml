name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp:
    name: C++ (${{ matrix.compiler.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc, cc: gcc, cxx: g++ }
          - { name: clang, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # AddressSanitizer + UndefinedBehaviorSanitizer (M5): the unit tests, then pytest
  # (including the 100k-command differential test) against the instrumented tools. Any
  # finding aborts the process and fails the job.
  sanitizers:
    name: ASan + UBSan (clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMF_SANITIZE=ON
      - name: Build
        run: cmake --build build -j
      - name: Test (GoogleTest)
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Test (pytest, sanitized tools)
        run: MF_DRIVER=build/engine/tools/mf_driver python -m pytest

  bindings:
    name: pybind11 stub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build mfengine
        run: |
          cmake -S . -B build -DMF_BUILD_BINDINGS=ON -DMF_BUILD_TESTS=OFF -DPython_EXECUTABLE="$(which python)"
          cmake --build build -j
      - name: Import mfengine
        run: PYTHONPATH=build/bindings python -c "import mfengine; print(mfengine.version())"

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      # The differential test (100k commands), golden tests and replay tests drive the
      # C++ tools.
      - name: Build mf_driver, mf-journal, mf-replay
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMF_BUILD_TESTS=OFF
          cmake --build build -j --target mf_driver mf-journal mf-replay
      - name: Test
        run: MF_DRIVER=build/engine/tools/mf_driver python -m pytest
