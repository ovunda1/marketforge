name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpp:
    name: C++ (${{ matrix.compiler.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc, cc: gcc, cxx: g++ }
          - { name: clang, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # AddressSanitizer + UndefinedBehaviorSanitizer (M5): the unit tests, then pytest
  # (including the 100k-command differential test) against the instrumented tools. Any
  # finding aborts the process and fails the job.
  sanitizers:
    name: ASan + UBSan (clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMF_SANITIZE=ON -DMF_BUILD_BINDINGS=ON -DPython_EXECUTABLE="$(which python)"
      - name: Build
        run: cmake --build build -j
      - name: Test (GoogleTest)
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Test (pytest, sanitized tools)
        run: MF_DRIVER=build/engine/tools/mf_driver python -m pytest
      # The sanitized mfengine in-process (M7). Python is not instrumented: the ASan
      # runtime is preloaded, and leak checks are off (the interpreter's own allocations
      # would be reported at exit). A venv without mfengine runs it, since the editable
      # install's import hook would win over PYTHONPATH; MF_EXPECT_MFENGINE checks it.
      - name: Test (pytest, sanitized bindings)
        run: |
          python -m venv /tmp/asan-venv
          /tmp/asan-venv/bin/pip install -q 'pytest>=8' 'mypy>=1.11'
          LD_PRELOAD="$(bindings/asan_runtime.sh clang++)" \
          ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 PYTHONMALLOC=malloc \
          PYTHONPATH=build/bindings/python MF_EXPECT_MFENGINE=build \
          MF_DRIVER=build/engine/tools/mf_driver /tmp/asan-venv/bin/python -m pytest tests/bindings

  # Benchmarks (M6) as a smoke test: the suite on the Release benchmark build (walk off),
  # including the pinned workload digests, then every benchmark at tiny sizes with its
  # results schema checked. No speed assertion: CI runners are too noisy for that.
  bench-smoke:
    name: Bench smoke (${{ matrix.compiler.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc, cc: gcc, cxx: g++ }
          - { name: clang, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Configure
        run: cmake -S . -B build-bench -DCMAKE_BUILD_TYPE=Release -DMF_CHECK_INVARIANTS=OFF -DMF_BUILD_BENCH=ON
      - name: Build
        run: cmake --build build-bench -j
      - name: Test (GoogleTest, benchmark build)
        run: ctest --test-dir build-bench --output-on-failure --no-tests=error
      - name: Smoke-run every benchmark
        run: python -m bench.run --build-dir build-bench --smoke
      - name: Workloads replayed with the invariant walk on
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMF_BUILD_TESTS=OFF
          cmake --build build -j --target mf-replay
          python -m bench.crosscheck --bench-dir build-bench --replay build/engine/tools/mf-replay

  # The release install for backtests (M7): Release, invariant walk off, not editable.
  # The full binding suite runs on it, against the tools built the same way.
  bindings-release:
    name: Python bindings (release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mfengine (Release, invariant checks off)
        run: |
          python -m pip install 'scikit-build-core>=0.10'
          python -m pip install --no-build-isolation -Cbuild-dir=build-py-release \
            -Ccmake.build-type=Release -Ccmake.define.MF_CHECK_INVARIANTS=OFF '.[dev]'
          python -c "import mfengine; assert not mfengine.INVARIANT_CHECKS and mfengine.BUILD_TYPE == 'Release'"
      - name: Build mf_driver, mf-journal, mf-replay
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMF_CHECK_INVARIANTS=OFF -DMF_BUILD_TESTS=OFF
          cmake --build build -j --target mf_driver mf-journal mf-replay
      - name: Test
        run: MF_DRIVER=build/engine/tools/mf_driver python -m pytest tests/bindings
      # Backtests run on this install (M8): the event backtester, and the committed
      # example runs reproduced byte for byte on Linux with a Release engine.
      - name: Test (backtests on the release install)
        run: python -m pytest tests/test_backtest_event.py tests/test_runs.py

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      # The install builds mfengine (M7, invariant checks on). The differential test
      # (100k commands), golden tests and replay tests drive the C++ tools.
      - name: Build mf_driver, mf-journal, mf-replay
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMF_BUILD_TESTS=OFF
          cmake --build build -j --target mf_driver mf-journal mf-replay
      - name: Test
        run: MF_DRIVER=build/engine/tools/mf_driver python -m pytest
