# The dashboard's nginx (M11): the static site, and the gateway under /api (prefix
# stripped) and /ws. X-Forwarded-For is overwritten with the address nginx saw: the
# gateway believes it only from this container (MF_TRUSTED_PROXIES=dashboard), so a
# client cannot choose the IP its practice-account limit is counted against.
# Docker's DNS is re-resolved, so an api restart (new address) needs no nginx restart.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    set $api http://api:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }

    # FastAPI's docs page (/api/docs) loads the schema from the root.
    location = /openapi.json {
        proxy_pass $api;
    }

    location /ws/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
